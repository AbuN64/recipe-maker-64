id = "gcc-kmc"
label = "GNU C 2.7.x for the console, third-party build"
source = "original"
toolchains = ["gcc-2.7.2-kmc"]
m2c_target = "mips-gcc-c"
supported_options = ["-O1", "-O2", "-O3", "-fno-strength-reduce", "-fno-expensive-optimizations", "-fno-schedule-insns2", "-mgp32", "-mfp32", "-mfp64", "-funsigned-char", "-fno-defer-pop", "-ffast-math", "-fno-delayed-branch", "-fforce-addr", "-fno-thread-jumps", "-fno-rerun-cse-after-loop", "-fno-cse-follow-jumps", "-fno-cse-skip-blocks"]

tells = [
  "register moves are written as an addu with the zero register",
  "a function that calls anything saves the return address and the callee-saved registers it uses in the prologue",
  "pointer walks over arrays appear as incremented pointers when strength reduction is on, as shifts and adds when off",
  "branch delay slots are filled by the scheduler pass; a nop there often means the pass was disabled",
  "float constants land in the read-only data in order of first use",
]
notes = [
  "the allocator orders pseudo registers by reference count over live length; changing a live range moves a register",
  "two identical blocks in different arms may be merged by the cross-jump pass unless their text differs",
  "-fno-strength-reduce is common in game code; try both before rewriting loops",
  "an inline function body is only inlined when it is defined before use and small",
]
